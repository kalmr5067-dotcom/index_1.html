if(vil.x+vil.w>tuna.x){vil.stolen=true;state='lost';sfx('fall');document.getElementById('ot').textContent='😈 الشرير سرق التونة!';document.getElementById('res').textContent='الوقت: '+time.toFixed(1)+' ثانية';showOv();return}
}

function drawCat(){

const gr=SKYG?{addColorStop(){}}:(SKYG=g.createLinearGradient(0,0,0,H));
if(dk){gr.addColorStop(0,'#090d2a');gr.addColorStop(.6,'#1f2b5a');gr.addColorStop(1,'#5b4a7d')}else{gr.addColorStop(0,'#3d9be9');gr.addColorStop(.55,'#9fd6ff');gr.addColorStop(1,'#ffeccb')}

g.fillStyle='rgba(246,241,216,.18)';g.beginPath();g.arc(640,80,48,0,7);g.fill();
g.fillStyle='#f6f1d8';g.beginPath();g.arc(640,80,26,0,7);g.fill();g.fillStyle='#17214a';g.beginPath();g.arc(651,72,23,0,7);g.fill()}
else{const sx=620-cam*.02;g.fillStyle='rgba(255,244,190,.28)';g.beginPath();g.arc(sx,85,62,0,7);g.fill();g.fillStyle='#fff6c8';g.beginPath();g.arc(sx,85,30,0,7);g.fill()}
for(let l=0;l<2;l++)for(let i=0;i<5;i++){const cx=((i*470+l*230-cam*(.2+l*.15)-t*(6+l*5))%2400+2400)%2400-300,cy=55+((i*47+l*31)%110)+l*40;g.fillStyle=dk?'rgba(200,210,255,'+(.14-l*.04)+')':'rgba(255,255,255,'+(.8-l*.3)+')';g.beginPath();g.ellipse(cx,cy,46,15,0,0,7);g.ellipse(cx+26,cy-9,30,14,0,0,7);g.ellipse(cx-24,cy-4,28,11,0,0,7);g.fill()}
g.fillStyle=dk?'#2b2748':'#ecce9c';g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=20){const u=x+cam*.12;g.lineTo(x,330+Math.sin(u*.008)*30+Math.sin(u*.021)*10)}g.lineTo(W,H);g.fill();
const sk=dk?'#1a2350':'#8fb4de';g.fillStyle=sk;
for(let k=0;k<16;k++){const id=k+Math.floor(cam*.3/60),bx=k*60-((cam*.3)%60),h=40+((id*73)%90),bw=34+((id*29)%18);g.fillRect(bx,H-30-h,bw,h+30);if(id%4==0)g.fillRect(bx+bw/2-1,H-30-h-18,2,18)}
const tx=((700-cam*.3)%1500+1500)%1500-60;g.fillStyle=dk?'#131a40':'#779fcf';g.fillRect(tx,H-270,10,250);g.fillRect(tx+24,H-270,10,250);g.fillRect(tx,H-232,34,6);g.beginPath();g.moveTo(tx,H-270);g.lineTo(tx+10,H-270);g.lineTo(tx+10,H-286);g.fill();g.beginPath();g.moveTo(tx+24,H-270);g.lineTo(tx+34,H-270);g.lineTo(tx+24,H-286);g.fill();g.fillStyle=dk?'rgba(8,12,30,.3)':'rgba(80,95,120,.4)';g.fillRect(0,0,W,H)}
function draw(){g.save();if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.5)shake=0}
if(secret)drawRoom();else drawSky();

for(const p of P){g.fillStyle=p.c1||css('--plat');g.fillRect(p.x-cam,p.y,p.w,p.h);g.fillStyle=p.c2||css('--top');g.fillRect(p.x-cam,p.y,p.w,6)}
drawApples();drawTuna();drawCat();drawBoost();drawVil();for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.x+=d.vx;d.y+=d.vy;d.vy+=.1;d.l-=.04;if(d.l<=0){dust.splice(i,1);continue}g.fillStyle='rgba(235,215,185,'+d.l*.8+')';g.beginPath();g.arc(d.x-cam,d.y,2+3*(1-d.l),0,7);g.fill()}
if(!secret){const dk2=css('--bg')=='#17120d',tt=performance.now()/1000;g.strokeStyle=dk2?'rgba(170,190,255,.55)':'rgba(60,100,160,.6)';g.lineWidth=1.3;g.beginPath();for(const r of rain){r.y+=r.v;r.x-=r.v*.22;if(r.y>H||r.x<-20){r.y=-20;r.x=Math.random()*(W+120)}g.moveTo(r.x,r.y);g.lineTo(r.x+r.v*.35,r.y-r.v*1.6)}g.stroke();
for(const p of P){const px=p.x-cam;if(px>W||px+p.w<0)continue;for(let j=0;j<2;j++){const ph=(tt*1.6+p.x*.013+j*.5)%1;g.strokeStyle='rgba(255,255,255,'+(1-ph)*.7+')';g.lineWidth=1;g.beginPath();g.ellipse(px+p.w*(((p.x*7+j*37)%90)+5)/100,p.y+1,ph*9,ph*2.6,0,0,7);g.stroke()}}
if(performance.now()>nextL){flash=1;nextL=performance.now()+7000+Math.random()*8000;sfx('thunder')}
if(flash>0){g.fillStyle='rgba(255,255,255,'+flash*.5+')';g.fillRect(0,0,W,H);flash*=.9;if(flash<.02)flash=0}}
if(state=='won')for(const c of conf){c.y+=c.v;if(c.y>H)c.y=-10;g.fillStyle=c.c;g.fillRect(c.x,c.y,6,9)}
if(!secret){const bx=200,bw=400,by=18,mx=v=>bx+Math.max(0,Math.min(1,v))*bw;g.fillStyle='rgba(0,0,0,.35)';g.fillRect(bx,by,bw,6);g.font='18px sans-serif';g.textAlign='center';g.fillText('🐟',bx+bw+14,by+8);g.fillText('😈',mx(vil.x/WORLD),by+8);g.fillText('🐱',mx(cat.x/WORLD),by+8);const rem=boostUntil-performance.now();if(rem>0&&state=='play'){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(bx,by+14,bw,5);g.fillStyle='#ffd23f';g.fillRect(bx,by+14,bw*rem/2000,5);g.fillText('🍎⚡ '+(rem/1000).toFixed(1),bx-50,by+8)}}g.restore()}
let acc=0,lastT=performance.now();(function loop(now){acc+=Math.min(now-lastT,100);lastT=now;while(acc>=16.667){step();acc-=16.667}draw();requestAnimationFrame(loop)})(performance.now());
